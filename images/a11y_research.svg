<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="Helvetica,Arial,sans-serif">
  <rect width="500" height="300" fill="#f7f9fb"/>
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">Same Barrier Hypothesis</text>
  <!-- Left: webpage -->
  <rect x="30" y="60" width="130" height="180" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="45" y="75" width="100" height="14" rx="3" fill="#0969da" opacity="0.8"/>
  <rect x="45" y="100" width="100" height="8" rx="3" fill="#d0d7de"/>
  <rect x="45" y="115" width="80" height="8" rx="3" fill="#d0d7de"/>
  <rect x="45" y="135" width="60" height="20" rx="4" fill="#2da44e" opacity="0.85"/>
  <rect x="45" y="170" width="100" height="8" rx="3" fill="#d0d7de"/>
  <rect x="45" y="185" width="90" height="8" rx="3" fill="#d0d7de"/>
  <text x="95" y="260" text-anchor="middle" font-size="12" fill="#57606a">Web page (DOM)</text>
  <!-- Arrows: degradation -->
  <line x1="170" y1="150" x2="220" y2="150" stroke="#cf222e" stroke-width="3" marker-end="url(#arrowR)"/>
  <text x="195" y="135" text-anchor="middle" font-size="11" fill="#cf222e" font-weight="bold">26 WCAG</text>
  <text x="195" y="147" text-anchor="middle" font-size="11" fill="#cf222e" font-weight="bold">operators</text>
  <!-- Middle: degraded a11y tree -->
  <rect x="225" y="80" width="120" height="140" rx="8" fill="#fff" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="285" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#cf222e">Degraded</text>
  <text x="285" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#cf222e">A11y Tree</text>
  <circle cx="255" cy="150" r="8" fill="#d0d7de"/>
  <circle cx="285" cy="175" r="8" fill="#d0d7de"/>
  <circle cx="315" cy="150" r="8" fill="#f0f0f0" stroke="#cf222e" stroke-dasharray="3 2"/>
  <line x1="255" y1="150" x2="285" y2="175" stroke="#d0d7de" stroke-width="2"/>
  <text x="285" y="260" text-anchor="middle" font-size="12" fill="#57606a">Accessibility Tree</text>
  <!-- Arrows to agents -->
  <line x1="355" y1="150" x2="395" y2="150" stroke="#57606a" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Right: agents -->
  <rect x="400" y="70" width="80" height="45" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="440" y="97" text-anchor="middle" font-size="12" fill="#0969da" font-weight="bold">AI Agent</text>
  <rect x="400" y="128" width="80" height="45" rx="8" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
  <text x="440" y="150" text-anchor="middle" font-size="11" fill="#1a7f37" font-weight="bold">Screen</text>
  <text x="440" y="164" text-anchor="middle" font-size="11" fill="#1a7f37" font-weight="bold">Reader</text>
  <rect x="400" y="186" width="80" height="45" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="440" y="206" text-anchor="middle" font-size="11" fill="#9a6700" font-weight="bold">93.8%</text>
  <text x="440" y="221" text-anchor="middle" font-size="11" fill="#9a6700" font-weight="bold">→ 38.5%</text>
  <text x="440" y="260" text-anchor="middle" font-size="12" fill="#57606a">N = 14,768</text>
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#cf222e"/></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/></marker>
  </defs>
</svg>
